<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFAF6"/>
      <stop offset="100%" stop-color="#E9E4D9"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14110F"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Editorial house silhouette -->
  <g transform="translate(720,140)">
    <rect x="0" y="80" width="380" height="240" fill="url(#house)" rx="4"/>
    <polygon points="0,80 190,0 380,80" fill="#14110F"/>
    <rect x="60" y="160" width="60" height="80" fill="#FBFAF6" opacity="0.85" rx="2"/>
    <rect x="260" y="160" width="60" height="80" fill="#FBFAF6" opacity="0.85" rx="2"/>
    <rect x="160" y="220" width="60" height="100" fill="#1F6B4A"/>
  </g>
  <!-- Brand wordmark -->
  <g transform="translate(80,460)">
    <circle cx="20" cy="20" r="20" fill="#14110F"/>
    <text x="20" y="27" font-family="Georgia, serif" font-size="20" font-weight="700" text-anchor="middle" fill="#FBFAF6">C</text>
    <text x="56" y="20" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#14110F">Cumbre</text>
    <text x="56" y="40" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#57534E">INMOBILIARIA - ZONA NORTE</text>
  </g>
  <!-- Tagline -->
  <g transform="translate(80,180)">
    <text font-family="system-ui, sans-serif" font-size="56" font-weight="700" fill="#14110F">
      <tspan x="0" y="0">Propiedades</tspan>
      <tspan x="0" y="74">curadas en</tspan>
      <tspan x="0" y="148" fill="#1F6B4A" font-style="italic" font-family="Georgia, serif" font-weight="500">zona norte.</tspan>
    </text>
  </g>
</svg>
