<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5DCC8"/>
      <stop offset="100%" stop-color="#C8BAA0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky5)"/>
  <!-- Ground -->
  <rect y="500" width="800" height="100" fill="#7A7058"/>
  <!-- Tall apartment building -->
  <rect x="220" y="80" width="360" height="440" fill="#D4C5A8"/>
  <!-- Top floor crown -->
  <rect x="200" y="70" width="400" height="20" fill="#5C4A30"/>
  <!-- Balconies (long continuous) -->
  <g>
    <!-- Floor 6 -->
    <rect x="220" y="120" width="360" height="50" fill="#9C8E72"/>
    <!-- Floor 5 -->
    <rect x="220" y="190" width="360" height="50" fill="#9C8E72"/>
    <!-- Floor 4 -->
    <rect x="220" y="260" width="360" height="50" fill="#9C8E72"/>
    <!-- Floor 3 -->
    <rect x="220" y="330" width="360" height="50" fill="#9C8E72"/>
    <!-- Floor 2 -->
    <rect x="220" y="400" width="360" height="50" fill="#9C8E72"/>
    <!-- Floor 1 -->
    <rect x="220" y="470" width="360" height="50" fill="#9C8E72"/>
  </g>
  <!-- Glass doors on each balcony -->
  <g fill="#3B4F5C" opacity="0.7">
    <rect x="260" y="135" width="60" height="20"/>
    <rect x="380" y="135" width="60" height="20"/>
    <rect x="500" y="135" width="60" height="20"/>

    <rect x="260" y="205" width="60" height="20"/>
    <rect x="380" y="205" width="60" height="20"/>
    <rect x="500" y="205" width="60" height="20"/>

    <rect x="260" y="275" width="60" height="20"/>
    <rect x="380" y="275" width="60" height="20"/>
    <rect x="500" y="275" width="60" height="20"/>

    <rect x="260" y="345" width="60" height="20"/>
    <rect x="380" y="345" width="60" height="20"/>
    <rect x="500" y="345" width="60" height="20"/>

    <rect x="260" y="415" width="60" height="20"/>
    <rect x="380" y="415" width="60" height="20"/>
    <rect x="500" y="415" width="60" height="20"/>

    <rect x="260" y="485" width="60" height="20"/>
    <rect x="380" y="485" width="60" height="20"/>
    <rect x="500" y="485" width="60" height="20"/>
  </g>
  <!-- Ground floor entrance -->
  <rect x="350" y="520" width="100" height="80" fill="#3A2418"/>
  <rect x="360" y="530" width="80" height="60" fill="#1F6B4A"/>
  <!-- Side trees -->
  <g>
    <ellipse cx="120" cy="490" rx="55" ry="55" fill="#3F5A38"/>
    <ellipse cx="690" cy="490" rx="60" ry="58" fill="#3F5A38"/>
  </g>
  <!-- Lampposts -->
  <g stroke="#1A1A1A" stroke-width="2">
    <line x1="100" y1="500" x2="100" y2="430"/>
    <circle cx="100" cy="425" r="6" fill="#FBFAF6"/>
    <line x1="700" y1="500" x2="700" y2="430"/>
    <circle cx="700" cy="425" r="6" fill="#FBFAF6"/>
  </g>
</svg>
