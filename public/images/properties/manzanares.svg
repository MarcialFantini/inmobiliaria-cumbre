<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="wall3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0E8DA"/>
      <stop offset="100%" stop-color="#D9CDB6"/>
    </linearGradient>
  </defs>
  <!-- Back wall -->
  <rect width="800" height="600" fill="url(#wall3)"/>
  <!-- Patio floor -->
  <polygon points="0,600 800,600 800,420 0,420" fill="#8B7355"/>
  <!-- Tile lines -->
  <g stroke="#5C4A30" stroke-width="1" opacity="0.4">
    <line x1="0" y1="460" x2="800" y2="460"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="200" y1="420" x2="200" y2="600"/>
    <line x1="400" y1="420" x2="400" y2="600"/>
    <line x1="600" y1="420" x2="600" y2="600"/>
  </g>
  <!-- House back wall -->
  <rect x="100" y="120" width="600" height="320" fill="#E2D5BB"/>
  <!-- Front door -->
  <rect x="350" y="260" width="100" height="180" fill="#3A2418" rx="2"/>
  <rect x="360" y="270" width="80" height="160" fill="#1F6B4A" opacity="0.9"/>
  <!-- Windows -->
  <g>
    <rect x="150" y="200" width="120" height="100" fill="#1A1A1A" rx="2"/>
    <rect x="160" y="210" width="50" height="40" fill="#88B0BC" opacity="0.6"/>
    <rect x="215" y="210" width="50" height="40" fill="#88B0BC" opacity="0.6"/>
    <rect x="160" y="255" width="50" height="40" fill="#88B0BC" opacity="0.6"/>
    <rect x="215" y="255" width="50" height="40" fill="#88B0BC" opacity="0.6"/>

    <rect x="530" y="200" width="120" height="100" fill="#1A1A1A" rx="2"/>
    <rect x="540" y="210" width="50" height="40" fill="#88B0BC" opacity="0.6"/>
    <rect x="595" y="210" width="50" height="40" fill="#88B0BC" opacity="0.6"/>
    <rect x="540" y="255" width="50" height="40" fill="#88B0BC" opacity="0.6"/>
    <rect x="595" y="255" width="50" height="40" fill="#88B0BC" opacity="0.6"/>
  </g>
  <!-- Window grills -->
  <g stroke="#1A1A1A" stroke-width="1.5" fill="none">
    <line x1="150" y1="250" x2="270" y2="250"/>
    <line x1="530" y1="250" x2="650" y2="250"/>
  </g>
  <!-- Grill/parrilla -->
  <rect x="50" y="430" width="100" height="120" fill="#3A2418"/>
  <g stroke="#FBFAF6" stroke-width="2" opacity="0.6">
    <line x1="60" y1="450" x2="140" y2="450"/>
    <line x1="60" y1="470" x2="140" y2="470"/>
    <line x1="60" y1="490" x2="140" y2="490"/>
    <line x1="60" y1="510" x2="140" y2="510"/>
  </g>
  <!-- Plant pots -->
  <g>
    <rect x="620" y="430" width="60" height="60" fill="#8B5A2B"/>
    <ellipse cx="650" cy="400" rx="35" ry="40" fill="#3F5A38"/>
    <rect x="160" y="450" width="50" height="50" fill="#8B5A2B"/>
    <ellipse cx="185" cy="425" rx="30" ry="35" fill="#5A6B4A"/>
  </g>
  <!-- Awning -->
  <polygon points="100,120 400,80 700,120 700,140 100,140" fill="#A08868"/>
  <g stroke="#7A6444" stroke-width="2">
    <line x1="160" y1="135" x2="160" y2="120"/>
    <line x1="240" y1="135" x2="240" y2="120"/>
    <line x1="320" y1="135" x2="320" y2="120"/>
    <line x1="400" y1="135" x2="400" y2="120"/>
    <line x1="480" y1="135" x2="480" y2="120"/>
    <line x1="560" y1="135" x2="560" y2="120"/>
    <line x1="640" y1="135" x2="640" y2="120"/>
  </g>
</svg>
