<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="herosky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2A28"/>
      <stop offset="60%" stop-color="#2E403A"/>
      <stop offset="100%" stop-color="#1A2622"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5EFE3"/>
      <stop offset="100%" stop-color="#D9CDB6"/>
    </linearGradient>
  </defs>
  <!-- Night sky background -->
  <rect width="800" height="1000" fill="url(#herosky)"/>
  <!-- Distant trees silhouette -->
  <path d="M0,650 Q200,580 400,610 T800,580 L800,720 L0,720 Z" fill="#0F1A18"/>
  <!-- House -->
  <rect x="180" y="380" width="440" height="380" fill="url(#facade)"/>
  <!-- Roof -->
  <polygon points="160,380 400,250 640,380" fill="#1A1A1A"/>
  <!-- Chimney -->
  <rect x="510" y="290" width="30" height="50" fill="#2D2520"/>
  <!-- Lit windows -->
  <g fill="#FBE6A1" opacity="0.95">
    <rect x="220" y="440" width="80" height="120" rx="2"/>
    <rect x="340" y="440" width="80" height="120" rx="2"/>
    <rect x="460" y="440" width="80" height="120" rx="2"/>
    <rect x="220" y="600" width="80" height="80" rx="2"/>
    <rect x="460" y="600" width="80" height="80" rx="2"/>
  </g>
  <!-- Window frames -->
  <g stroke="#1A1A1A" stroke-width="2" fill="none">
    <rect x="220" y="440" width="80" height="120"/>
    <line x1="260" y1="440" x2="260" y2="560"/>
    <line x1="220" y1="500" x2="300" y2="500"/>

    <rect x="340" y="440" width="80" height="120"/>
    <line x1="380" y1="440" x2="380" y2="560"/>
    <line x1="340" y1="500" x2="420" y2="500"/>

    <rect x="460" y="440" width="80" height="120"/>
    <line x1="500" y1="440" x2="500" y2="560"/>
    <line x1="460" y1="500" x2="540" y2="500"/>

    <rect x="220" y="600" width="80" height="80"/>
    <line x1="260" y1="600" x2="260" y2="680"/>
    <line x1="220" y1="640" x2="300" y2="640"/>

    <rect x="460" y="600" width="80" height="80"/>
    <line x1="500" y1="600" x2="500" y2="680"/>
    <line x1="460" y1="640" x2="540" y2="640"/>
  </g>
  <!-- Front door -->
  <rect x="340" y="600" width="80" height="160" fill="#1F6B4A"/>
  <circle cx="408" cy="680" r="3" fill="#FBFAF6"/>
  <!-- Front garden / path -->
  <rect y="760" width="800" height="240" fill="#0F1A18"/>
  <rect x="360" y="760" width="80" height="240" fill="#5C4329" opacity="0.6"/>
  <!-- Bushes -->
  <ellipse cx="160" cy="760" rx="60" ry="35" fill="#1A2622"/>
  <ellipse cx="640" cy="760" rx="60" ry="35" fill="#1A2622"/>
  <!-- Moon -->
  <circle cx="660" cy="160" r="60" fill="#FBFAF6" opacity="0.85"/>
  <circle cx="640" cy="150" r="58" fill="url(#herosky)" opacity="0.4"/>
  <!-- Stars -->
  <g fill="#FBFAF6" opacity="0.7">
    <circle cx="120" cy="100" r="1.5"/>
    <circle cx="220" cy="60" r="1"/>
    <circle cx="320" cy="120" r="1.5"/>
    <circle cx="100" cy="220" r="1"/>
    <circle cx="540" cy="80" r="1"/>
    <circle cx="700" cy="280" r="1.5"/>
  </g>
</svg>
